<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asad Nadkar | Project Details</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="container header-container">
            <div class="logo">ASAD<span>NADKAR</span></div>
            <nav>
                <ul>
                    <li><a href="index.html">Home</a></li>
                    <li><a href="projects.html">Projects</a></li>
                    <li><a href="studio.html">Portfolio</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="mobile-menu-btn">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- Project Detail -->
    <section class="project-detail">
        <div class="container">
            <div class="project-hero" id="project-hero"></div>
            
            <div class="project-info-grid">
                <div class="project-description">
                    <h3>Project Description</h3>
                    <p id="project-description-text"></p>
                </div>
                <div class="project-details">
                    <h3>Project Details</h3>
                    <div class="details-list" id="project-details-list"></div>
                </div>
            </div>

            <div class="project-gallery" id="project-gallery"></div>

            <!-- Technical Work Carousel (Hidden by default) -->
            <div class="technical-carousel-section" id="technicalCarouselSection" style="display: none;">
                <div class="carousel-heading">
                    <h3>Technical Drawings</h3>
                </div>
                <div class="fp-carousel">
                    <div class="fp-carousel-container">
                        <div class="fp-carousel-track" id="technicalCarouselTrack"></div>
                    </div>
                    <button class="fp-carousel-btn fp-prev" id="technicalPrevBtn">‹</button>
                    <button class="fp-carousel-btn fp-next" id="technicalNextBtn">›</button>
                    <div class="fp-carousel-dots" id="technicalCarouselDots"></div>
                </div>
            </div>

            <div class="project-navigation">
                <a href="projects.html" class="btn btn-outline">Back to Projects</a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer>
        <div class="container">
            <div class="footer-content">
                <div class="footer-logo">ASAD<span>NADKAR</span></div>
                <div class="social-links">
                    <a href="#"><i class="fab fa-twitter"></i></a>
                    <a href="https://www.instagram.com/arch67lab"><i class="fab fa-instagram"></i></a>
                    <a href="#"><i class="fab fa-linkedin-in"></i></a>
                    <a href="#"><i class="fab fa-pinterest"></i></a>
                </div>
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 AsadNadkar. All rights reserved.</p>
            </div>
        </div>
    </footer>
    
    <script src="assets/js/projects-data.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
